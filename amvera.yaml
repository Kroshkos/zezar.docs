# Конфигурация деплоя на Amvera — сайт документации и новостей «ЦЕЗАРЬ»
# Документация: https://docs.amvera.ru/applications/environments/nodejs-browser.html
#
# Профиль Node.JS Browser: при сборке выполняется `npm install && npm run build`
# (скрипт build собирает Markdown из news/ и docs/ в static/content.json),
# затем встроенный nginx раздаёт артефакты сборки.
#
# ВАЖНО про формат артефактов (согласно документации Amvera):
#   artifacts — это словарь "<путь-в-репозитории>: <папка-назначения>".
#   Ключ "static/*" сопоставляет ВСЕ файлы из папки static/, а значение "/"
#   кладёт их прямо в корень веб-сервера. То есть файл static/index.html
#   будет доступен по адресу /index.html, static/css/style.css — по /css/style.css.
#   Именно поэтому в HTML подключаются пути БЕЗ префикса /static/ — иначе
#   получался бы /static/static/css/style.css (404) и стили не применялись.
meta:
  environment: node
  toolchain:
    name: browser
    version: "18"

build:
  artifacts:
    "static/*": /

# Конфигурация сборки/запуска для Amvera Cloud
# Документация: https://docs.amvera.ru/applications/configuration/config-file.html
#
# Сайт Zezar — чистый статический HTML/CSS/JS (без npm-сборки), поэтому
# используется окружение node + toolchain browser: на этапе запуска Amvera
# раздаёт файлы через встроенный nginx с поддержкой SPA-маршрутизации.
#
# По умолчанию в артефакты попадают файлы из папки build/; так как у нас всё
# лежит в корне репозитория, переопределяем artifacts на корневые файлы.
meta:
  environment: node
  toolchain:
    name: browser
    version: "18"

build:
  # Сборка не нужна — просто копируем все файлы проекта в корень приложения.
  artifacts:
    "*": /

run:
  # Для браузерных (статических) приложений параметров запуска нет —
  # используется модифицированный образ nginx с поддержкой SPA-роутинга.

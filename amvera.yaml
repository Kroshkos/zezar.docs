# Конфигурация деплоя на Amvera — сайт документации и новостей «ЦЕЗАРЬ»
# Документация: https://docs.amvera.ru/applications/environments/nodejs-browser.html
#
# Профиль Node.JS Browser: при сборке выполняется `npm install && npm run build`,
# затем nginx раздаёт содержимое артефактов (папка static/) с SPA-роутингом.
# Контент сайта (news/*.md, docs/*.md) собирается в static/content.json
# скриптом build/content-gen.mjs на Node.js прямо во время сборки (см. package.json).
meta:
  environment: node
  toolchain:
    name: browser
    version: "18"

build:
  artifacts:
    "static/*": /
